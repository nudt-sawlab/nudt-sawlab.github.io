{{- define "main" -}}

<article class="article">
  <div class="article-container pt-3">
    <div class="article-header article-header-caption">
      <h1 class="article-title">{{ .Title }}</h1>
    </div>

    <div class="article-style">
      {{ .Content }}
    </div>

    {{/* Render the supervisors widget if supervisors param exists */}}
    {{ if .Params.supervisors }}
      {{ partial "widgets/supervisors.html" (dict "root" $ "page" .) }}
    {{ end }}
  </div>
</article>

{{- end -}}
